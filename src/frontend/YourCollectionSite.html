<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Your Collection</title>
    <link rel="stylesheet" href="YourCollectionStyle.css">
</head>
<body>
<main class="app">
    <header>
        <h1>Your Collection Playground</h1>
        <p>Verbinde das Spring-Backend mit dem Browser und verwalte deine Lieblingsstädte über HTTP.</p>
    </header>

    <section class="card">
        <h2>1. Datenstruktur wählen</h2>
        <div class="structure-picker">
            <button type="button" data-type="list" class="active">List</button>
            <button type="button" data-type="set">Set</button>
            <button type="button" data-type="queue">Queue</button>
        </div>
        <p class="hint">Alle Anfragen gehen an <code>http://localhost:8080/getConnection</code></p>
    </section>

    <section class="card">
        <h2>2. Städte verwalten</h2>
        <div class="form-grid">
            <label>
                Neue Stadt
                <input type="text" id="city-input" placeholder="z. B. Saarbrücken">
            </label>
            <button type="button" id="add-city">Hinzufügen</button>

            <label>
                Stadt entfernen
                <input type="text" id="remove-input" placeholder="Name der Stadt">
            </label>
            <button type="button" id="remove-city" class="danger">Löschen</button>

            <label>
                Suche nach Stadt
                <input type="text" id="search-input" placeholder="Name der Stadt">
            </label>
            <button type="button" id="search-city" class="secondary">Prüfen</button>
        </div>
        <div id="message" role="status"></div>
    </section>

    <section class="card">
        <h2>3. Route anzeigen</h2>
        <div class="toolbar">
            <label>Sortierung
                <select id="order-select">
                    <option value="input">Einfügereihenfolge</option>
                    <option value="asc">Alphabetisch (A-Z)</option>
                    <option value="desc">Alphabetisch (Z-A)</option>
                </select>
            </label>
            <button type="button" id="refresh" class="secondary">Aktualisieren</button>
        </div>
        <ul id="route-list"></ul>
    </section>
</main>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const baseUrl = "http://localhost:8080/getConnection";
        const typeButtons = document.querySelectorAll(".structure-picker button");
        const messageBox = document.getElementById("message");
        const inputNeueStadt = document.getElementById("city-input");
        const buttonNeueStadt = document.getElementById("add-city");
        const buttonRefreshRoute = document.getElementById("refresh");
        const routeList = document.getElementById("route-list");
        const orderSelect = document.getElementById("order-select");
        let selectedType = "list";

        typeButtons.forEach((button) => {
            button.addEventListener("click", () => {
                typeButtons.forEach((item) => item.classList.remove("active"));
                button.classList.add("active");
                selectedType = button.dataset.type;
            });
        });
        
        async function selectTypes() {
            try {
                const response = await fetch(`${baseUrl}/types`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const types = await response.json();

                typeButtons.forEach((button) => {
                    const enabled = types.includes(button.dataset.type);
                    button.disabled = !enabled;
                    if (!enabled) {
                        button.classList.remove("active");
                    }
                });

                messageBox.textContent = `Geladene Typen: ${types.join(", ")}`;
                messageBox.dataset.tone = "success";
            } catch (error) {
                messageBox.textContent = "Typen konnten nicht geladen werden.";
                messageBox.dataset.tone = "error";
            }
        }

        async function addCity() {
            const city = inputNeueStadt.value.trim();
            if (!city) {
                messageBox.textContent = "Bitte eine Stadt eingeben.";
                messageBox.dataset.tone = "error";
                return;
            }

            try {
                const query = new URLSearchParams({ rawType: selectedType, city });
                const response = await fetch(`${baseUrl}/newCity?${query.toString()}`, {
                    method: "POST"
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const text = await response.text();
                messageBox.textContent = text;
                messageBox.dataset.tone = "success";
                inputNeueStadt.value = "";
                await route();
            } catch (error) {
                messageBox.textContent = "Stadt konnte nicht hinzugefügt werden.";
                messageBox.dataset.tone = "error";
            }
        }

        async function route() {
            try {
                const query = new URLSearchParams({
                    rawType: selectedType,
                    order: orderSelect.value
                });

                const response = await fetch(`${baseUrl}/route/ordered?${query.toString()}`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const cities = await response.json();
                routeList.innerHTML = "";

                if (cities.length === 0) {
                    const item = document.createElement("li");
                    item.textContent = "Noch keine Städte vorhanden.";
                    routeList.appendChild(item);
                    return;
                }

                cities.forEach((city) => {
                    const item = document.createElement("li");
                    item.textContent = city;
                    routeList.appendChild(item);
                });
            } catch (error) {
                messageBox.textContent = "Route konnte nicht geladen werden.";
                messageBox.dataset.tone = "error";
            }
        }

        buttonNeueStadt.addEventListener("click", addCity);
        buttonRefreshRoute.addEventListener("click", route);

        selectTypes();
        route();
    });
</script>
</body>
</html>
